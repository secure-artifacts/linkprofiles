# 骨架，等内网补全。只在产物仓库还没有 .gitlab-ci.yml 时写入一次，
# 之后 `pnpm deployToGitlab` 不会再碰它 —— 这里怎么改都不会被覆盖。
#
# 仓库里已经有什么：dist/、public/_admin/、fonts/、drizzle/、依赖清单与 Dockerfile。
# 不需要编译，docker build 就能出镜像。
#
# runner 要能访问 npm registry 与 Docker Hub（或内网镜像源）。这不是新增要求：
# 以前是服务器自己构建，同样要这两样。
#
# 服务器与 runner 架构不一致时记得指定平台，sharp 会按构建机的架构取二进制。
#
# 需要的 CI/CD 变量（Settings → CI/CD → Variables，都建成 masked + protected）：
#   DEBUG_QUERY_TOKEN  只读 SQL 排查接口的令牌，`openssl rand -hex 32` 生成。
#                      必须带进执行 docker compose 的环境，compose 会转给容器；
#                      没带进去接口只会一律返回 401，其他功能不受影响。见 docs/operations.md 第 9 节。

stages:
  - build
  - deploy

build-image:
  stage: build
  script:
    - echo "TODO: docker build -t $IMAGE:$CI_COMMIT_SHORT_SHA . && docker push"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  # DEBUG_QUERY_TOKEN 作为项目变量已经在 job 环境里，但要真正到容器里还差一步：
  # shell runner 直接跑 compose 就够了；经 ssh 执行时 shell 环境不会跟着过去，
  # 得写成 ssh host "DEBUG_QUERY_TOKEN='$DEBUG_QUERY_TOKEN' docker compose up -d"，
  # 或者由 job 把它写进服务器的 .env。两条路都没做，排查接口会一律 401。
  script:
    # 迁移随应用启动执行且没有分布式锁，必须先停旧再起新，不能双实例并存。
    - echo "TODO: 在目标服务器上 docker compose down && docker compose up -d"
    - echo "TODO: curl --fail http://127.0.0.1:3000/_api/health"
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
