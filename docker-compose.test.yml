# 独立的测试库，本地与 CI 共用同一套。
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgres://linkprofile:linkprofile@localhost:55432/link_profile_test pnpm test
#
# 每个测试文件在库中开一个独立 schema，跑完 drop，因此文件之间可以并行且互不干扰。
services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: linkprofile
      POSTGRES_PASSWORD: linkprofile
      POSTGRES_DB: link_profile_test
    ports:
      - '55432:5432'
    # 测试库不需要持久化，落在 tmpfs 上换取速度。
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linkprofile -d link_profile_test']
      interval: 3s
      timeout: 3s
      retries: 20
